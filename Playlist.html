<!DOCTYPE html>
<html>
  <head>
    <title>Random YT Playlist</title>
    <script>
      const playlists = [
        "https://music.youtube.com/playlist?list=PL1XXXXXXXXXXX",
        "https://music.youtube.com/playlist?list=PL2XXXXXXXXXXX",
        "https://music.youtube.com/playlist?list=PL3XXXXXXXXXXX"
      ];
      // Immediately redirect
      window.location.href = playlists[Math.floor(Math.random() * playlists.length)];
    </script>
  </head>
  <body>
    <p>Redirecting to a random playlist...</p>
  </body>
</html>
